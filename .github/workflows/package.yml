name: Package
on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing tag to build as an unpublished draft'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and prepare as a draft release; leave empty for workflow artifacts only'
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify requested release tag
        if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo 'Release tags must start with v followed by a digit.' >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web build
      - run: cargo build --release -p canharbor-cli --features web-ui,slcan --locked
      - name: Package binary and matching source
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/package.py --platform "$PACKAGE_PLATFORM"
      - name: Verify archives and smoke-test extracted package
        timeout-minutes: 5
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/verify-package.py --platform "$PACKAGE_PLATFORM"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: canharbor-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
  release-draft:
    if: inputs.tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: canharbor-*
          path: release-assets
          merge-multiple: true
      - name: Verify archives and prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release-assets
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Refusing to modify a published release.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CANHarbor $RELEASE_TAG" --notes-file ../docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.zip ./*.sha256 --clobber
