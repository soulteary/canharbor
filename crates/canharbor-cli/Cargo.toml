[package]
name = "canharbor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
[[bin]]
name = "canharbor"
path = "src/main.rs"
[features]
default = []
web-ui = ["canharbor-server/web-ui"]
slcan = ["dep:canharbor-slcan"]
kvaser = ["dep:canharbor-kvaser", "dep:canharbor-driver"]
peak = ["dep:canharbor-peak", "dep:canharbor-driver"]
[dependencies]
canharbor-stress = {path="../canharbor-stress"}
libc = "0.2"
canharbor-replay = { path = "../canharbor-replay" }
canharbor-client = { path = "../canharbor-client" }
canharbor-kvaser = { path = "../canharbor-kvaser", optional = true }
canharbor-peak = { path = "../canharbor-peak", optional = true }
canharbor-driver = { path = "../canharbor-driver", optional = true }
canharbor-core.workspace = true
canharbor-slcan = { path = "../canharbor-slcan", optional = true }
canharbor-gsusb = { path = "../canharbor-gsusb" }
canharbor-virtual.workspace = true
canharbor-server.workspace = true
tokio = {workspace=true,features=["process"]}
serde_json.workspace = true
uuid.workspace = true
futures-util.workspace = true
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.29"

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
