[package]
name = "canharbor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
[[bin]]
name = "canharbor"
path = "src/main.rs"
[features]
default = []
web-ui = ["canharbor-server/web-ui"]
slcan = ["dep:canharbor-slcan"]
peak = ["dep:canharbor-peak", "dep:canharbor-driver"]
[dependencies]
canharbor-peak = { path = "../canharbor-peak", optional = true }
canharbor-driver = { path = "../canharbor-driver", optional = true }
canharbor-core.workspace = true
canharbor-slcan = { path = "../canharbor-slcan", optional = true }
canharbor-gsusb = { path = "../canharbor-gsusb" }
canharbor-virtual.workspace = true
canharbor-server.workspace = true
tokio.workspace = true
serde_json.workspace = true
uuid.workspace = true
futures-util.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"

[dev-dependencies]
libc = "0.2"
