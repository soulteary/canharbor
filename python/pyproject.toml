[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canharbor"
version = "0.1.0.dev0"
description = "CANHarbor local-service client through its versioned C ABI"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "CANHarbor contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
